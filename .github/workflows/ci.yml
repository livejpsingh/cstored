name: CI Pipeline

on:
  push:
    branches: [ main, master, develop, feature/* ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  lint-and-format:
    name: Lint & Format Check
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install LLVM tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format clang-tidy ninja-build cmake

      - name: Check clang-format
        run: |
          find src include tests \( -name "*.c" -o -name "*.h" \) ! -path "*/unity/*" -exec clang-format -i {} +

      - name: Configure for clang-tidy
        run: |
          cmake -B build-lint -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run clang-tidy
        run: |
          clang-tidy -p build-lint src/*.c

  sanitizers-and-valgrind:
    name: Tests & Memory Safety (ASan, TSan, Valgrind)
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: Debug
            flags: "-DCMAKE_BUILD_TYPE=Debug"
            valgrind: true
          - profile: ASan-UBSan
            flags: "-DCMAKE_BUILD_TYPE=Debug -DKVS_ENABLE_ASAN=ON"
            valgrind: false
          - profile: TSan
            flags: "-DCMAKE_BUILD_TYPE=Debug -DKVS_ENABLE_TSAN=ON"
            valgrind: false
          - profile: Release
            flags: "-DCMAKE_BUILD_TYPE=Release"
            valgrind: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc ninja-build cmake valgrind

      - name: Configure CMake (${{ matrix.profile }})
        run: |
          cmake -B build -G Ninja ${{ matrix.flags }}

      - name: Build (${{ matrix.profile }})
        run: |
          if ! cmake --build build --parallel -v > build.log 2>&1; then
            cat build.log
            ERR=$(tail -n 25 build.log | tr '\n' ' ' | tr '"' "'")
            echo "::error title=Build Failure::$ERR"
            exit 1
          fi
          cat build.log

      - name: Run Complete Test Suite (${{ matrix.profile }})
        run: |
          ctest --test-dir build --output-on-failure

      - name: Run Valgrind Full Leak & Error Check
        if: ${{ matrix.valgrind }}
        run: |
          for test_bin in build/bin/test_*; do
            if [ "$(basename "$test_bin")" != "test_crash_recovery" ]; then
              echo "Running Valgrind on $test_bin"
              valgrind --leak-check=full \
                       --show-leak-kinds=all \
                       --track-origins=yes \
                       --error-exitcode=1 \
                       "$test_bin"
            fi
          done
