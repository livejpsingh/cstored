name: CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  lint-and-format:
    name: Lint & Format Check
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install LLVM tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format clang-tidy ninja-build cmake

      - name: Check clang-format
        run: |
          find src include tests -name "*.c" -o -name "*.h" | grep -v "tests/unity" | xargs clang-format --dry-run --Werror

      - name: Configure for clang-tidy
        run: |
          cmake -B build-lint -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run clang-tidy
        run: |
          clang-tidy -p build-lint src/*.c tests/*.c -- -Iinclude -Itests/unity

  sanitizers-and-valgrind:
    name: Tests & Memory Safety (ASan, TSan, Valgrind)
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: Debug
            flags: ""
            valgrind: true
          - profile: ASan-UBSan
            flags: "-DKVS_ENABLE_ASAN=ON"
            valgrind: false
          - profile: TSan
            flags: "-DKVS_ENABLE_TSAN=ON"
            valgrind: false
          - profile: Release
            flags: "-DCMAKE_BUILD_TYPE=Release"
            valgrind: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc ninja-build cmake valgrind

      - name: Configure CMake (${{ matrix.profile }})
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug ${{ matrix.flags }}

      - name: Build (${{ matrix.profile }})
        run: |
          cmake --build build --parallel

      - name: Run Unit & Concurrency Tests (${{ matrix.profile }})
        run: |
          ctest --test-dir build --output-on-failure

      - name: Run Valgrind Leak Check
        if: ${{ matrix.valgrind }}
        run: |
          valgrind --leak-check=full \
                   --show-leak-kinds=all \
                   --track-origins=yes \
                   --error-exitcode=1 \
                   build/bin/test_slab

          valgrind --leak-check=full \
                   --show-leak-kinds=all \
                   --track-origins=yes \
                   --error-exitcode=1 \
                   build/bin/test_hash

          valgrind --leak-check=full \
                   --show-leak-kinds=all \
                   --track-origins=yes \
                   --error-exitcode=1 \
                   build/bin/test_hash_table

          valgrind --leak-check=full \
                   --show-leak-kinds=all \
                   --track-origins=yes \
                   --error-exitcode=1 \
                   build/bin/test_thread_pool

          valgrind --leak-check=full \
                   --show-leak-kinds=all \
                   --track-origins=yes \
                   --error-exitcode=1 \
                   build/bin/test_concurrent_ht
